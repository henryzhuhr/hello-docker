services:
  hello-docker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    image: hello-docker:latest  # 构建后镜像的名称和标签，建议和项目绑定，否则和其他项目冲突
    restart: unless-stopped # 重启策略
    environment:
      APP_NAME: "hello-docker"
      # -- nvidia-docker
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - ".:/root/hello-docker"
      - "~/.ssh:/root/.ssh:ro" # 挂载宿主机的ssh配置文件，方便推拉代码（只读）
      - "/etc/localtime:/etc/localtime:ro" # 挂载宿主机时间到容器
    working_dir: /root/hello-docker
    networks:
      - hello-docker-network
    # -- 端口映射
    ports:          
      - "22:22" 
    # runtime: nvidia  # 使用 nvidia-docker
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    # -- sleep infinity 用于保持容器运行，否则 vscode 无法进入容器
    command: ["sleep", 'infinity']

# -- 网络名称，用于容器间通信
networks:
  hello-docker-network:

# -- 数据卷名称，用于持久化数据
# volumes: